const raw=[
[0,'Foundation','How would you model a student enrolling in multiple courses in Dataverse?',['Use Student, Course and Enrollment tables.','Enrollment links a student and course with lookups and stores dates, status and fees.','Choose relationships and ownership based on reporting and access requirements.']],
[0,'Foundation','Explain security roles, business units and teams using a training institute example.',['Privileges define allowed operations and access depth.','Business units establish security boundaries; roles grant privileges.','Owner teams can own records; access teams share access to specific records.']],
[0,'Foundation','When would you use a business rule, a cloud flow or a plug-in?',['Business rules suit supported field validation and simple logic.','Cloud flows suit asynchronous automation and connectors.','Plug-ins suit server-side event logic and transactional validation; consider latency and supportability.']],
[0,'Advanced','An admission record must not be created when a course is full. Design a robust server-side solution.',['Validate server-side and return a clear error before committing the admission.','Consider transaction boundaries and concurrent requests; a count query alone does not prevent races.','Use a concurrency-safe capacity reservation approach and test simultaneous admissions.']],
[0,'Advanced','A plug-in updates its own triggering table and starts looping. How do you diagnose and fix it?',['Inspect trace logs, correlation IDs, pipeline stage and execution context.','Use filtering attributes and compare meaningful changes with pre-images.','Avoid unnecessary updates; make processing idempotent and do not rely only on a blanket depth check.']],
[0,'Advanced','How would you move a solution with flows and integrations from development to production?',['Use solution-aware components and managed solutions downstream.','Configure environment variables and connection references for the target environment.','Plan dependencies, deployment validation, secrets, rollback and post-deployment smoke tests.']],
[1,'Foundation','Build an onboarding flow when a student is admitted. What are the main steps?',['Use a Dataverse trigger with suitable filtering conditions.','Read related student and course data and validate required values.','Create onboarding tasks and send a notification, with failure handling.']],
[1,'Foundation','How do List rows, Apply to each and Compose work together?',['List rows returns a collection of records.','Apply to each iterates the value array.','Compose stores or transforms an expression result; use filtering and selected columns to reduce data.']],
[1,'Foundation','An API sometimes returns null for a phone number. How do you handle it in a flow?',['Allow null in the Parse JSON schema where the contract permits it.','Use explicit null checks or coalesce for a suitable fallback.','Validate required values separately and distinguish null, empty strings and missing properties.']],
[1,'Advanced','A flow creates duplicate enrollments after retries. How would you prevent this?',['Use a stable business key or an idempotency key.','Enforce uniqueness or use an appropriate upsert strategy.','Handle duplicate responses safely and review concurrency, retry and trigger settings.']],
[1,'Advanced','How would you integrate an API that throttles large batches of updates?',['Respect rate limits and Retry-After responses.','Use controlled concurrency, pagination and retry backoff.','Checkpoint progress and capture failures for safe replay without duplication.']],
[1,'Advanced','Design error handling and monitoring for a production onboarding flow.',['Group work in scopes and configure run-after conditions for failures.','Capture safe error context and correlation IDs and notify an owner.','Separate transient failures from validation errors and establish a replay procedure.']],
[2,'Foundation','When would you choose an Azure Function instead of putting all logic in a cloud flow?',['Use Functions for custom code, complex transformations or reusable services.','Consider flow orchestration and connector strengths.','Evaluate authentication, operations, latency and cost.']],
[2,'Foundation','Describe a secure way for an Azure Function to access Dataverse.',['Use Microsoft Entra authentication and an application identity supported by the architecture.','Configure the corresponding Dataverse application user and least-privilege roles.','Protect credentials or certificates and avoid logging tokens.']],
[2,'Foundation','What role could Logic Apps play between an external admissions portal and D365?',['Receive or orchestrate integration events and call appropriate connectors or APIs.','Validate and transform payloads before writing Dataverse records.','Handle errors, retries and correlation for operational support.']],
[2,'Advanced','Design an integration that can handle a surge of 50,000 incoming student records.',['Buffer work through a queue and process with controlled concurrency.','Use idempotent writes, retries and a dead-letter path.','Monitor throughput and Dataverse service protection limits and make replay safe.']],
[2,'Advanced','An external system times out although the enrollment was created. What should the API do on retry?',['Accept a stable idempotency key and persist processing state.','Return the previously created result when the same request is replayed.','Handle in-progress requests and conflicting payloads deliberately.']],
[2,'Advanced','How would you investigate failures across API Management, a Function and Dataverse?',['Propagate correlation identifiers across the request path.','Inspect safe structured logs, dependencies, latency and status codes.','Check identity, role permissions, throttling and payload errors without exposing secrets.']],
[3,'Foundation','How do you access form context in a model-driven app event handler?',['Accept the executionContext parameter and call getFormContext().','Register the handler and pass execution context.','Access attributes and controls safely and check for missing controls.']],
[3,'Foundation','How would you require an email subject before a form save?',['Read the subject attribute and validate its value.','Show an actionable notification and cancel save using supported event APIs when invalid.','Consider all save paths and use server-side validation when enforcement must be universal.']],
[3,'Foundation','How would you retrieve related records using the Dataverse Web API?',['Use a supported Web API client with the correct table logical name.','Select needed columns and filter by the relationship or key.','Handle asynchronous results, errors and paging.']],
[3,'Advanced','A field appears on the form and in a business process flow. How would you hide only the BPF control?',['Distinguish the attribute from its multiple controls.','Target the relevant BPF control and handle controls that are not present.','Account for stage changes and reapply UI logic; hiding is not a security boundary.']],
[3,'Advanced','An asynchronous validation must finish before saving a form. What should you consider?',['Use supported asynchronous save handling for the app configuration.','Handle timeouts, errors and re-entry without creating save loops.','Keep authoritative business validation server-side and test auto-save and manual save.']],
[3,'Advanced','How would you build a command that processes selected grid rows safely?',['Receive and validate the selected record references.','Use supported APIs with bounded concurrency and per-record error handling.','Show progress and results, prevent duplicate submissions and respect server-side permissions.']]

const base=raw.map((r,i)=>({id:'q'+i,track:tracks[r[0]],level:r[1],text:r[2],guide:r[3]}));
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let storageOK=true;function read(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}}function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch{storageOK=false;toast('Browser storage is unavailable or full. Download your report before leaving.');return false}}
let custom=read('kc-questions-v1',[]),history=read('kc-history-v1',[]),session=read('kc-active-v1',null),page='practice',lastReport=null;
if(!Array.isArray(custom))custom=[];if(!Array.isArray(history))history=[];
custom=custom.filter(q=>q&&tracks.includes(q.track)&&Array.isArray(q.guide)&&typeof q.text==='string');history=history.filter(r=>r&&Array.isArray(r.questions));
if(session&&(!Array.isArray(session.questions)||!Array.isArray(session.answers)))session=null;
let config={track:tracks[0],level:'All levels',mode:'Student practice',count:5,minutes:15,name:''};
const params=new URLSearchParams(location.search);if(tracks.includes(params.get('track')))config.track=params.get('track');if(['All levels','Foundation','Advanced'].includes(params.get('level')))config.level=params.get('level');if([3,5,8].includes(+params.get('count')))config.count=+params.get('count');if([10,15,20,30].includes(+params.get('minutes')))config.minutes=+params.get('minutes');
function bank(){return base.concat(custom)}function toast(t){document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=t;document.body.append(el);setTimeout(()=>el.remove(),5000)}
function foot(){return '<footer><span>Kushal Chowdary · D365 CRM Tech Solutions</span><span>Practice with purpose. Interview with confidence.</span></footer>'}
function setPage(p){page=p;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('breadcrumb').textContent=({practice:'Practice room',bank:'Question bank',history:'Session history',interview:'Interview in progress',report:'Session report'})[p];render()}
function render(){if(page==='practice')home();if(page==='bank')showBank();if(page==='history')showHistory();if(page==='interview')showInterview();if(page==='report')showReport(lastReport)}
function available(){return bank().filter(q=>q.track===config.track&&(config.level==='All levels'||q.level===config.level))}
function home(){const count=Math.min(config.count,available().length);$('app').innerHTML=`<div class="eyebrow">READY FOR YOUR NEXT OPPORTUNITY</div><h1>Your next great interview starts here.</h1><p class="muted">A focused space to practise, reflect, and grow your technical confidence.</p><section class="hero"><div><div class="eyebrow">THE PRACTICE ROOM</div><h2>Turn what you know<br>into answers that stand out.</h2><p>Real scenarios. Structured practice. Clear next steps.<br>Made for D365 CRM & Power Platform learners.</p><span class="pill" style="background:#ffffff15;color:#ded6ff">${bank().length} curated & custom questions</span><span class="pill" style="background:#ffffff15;color:#ded6ff">4 technical tracks</span></div><div class="hero-art" aria-hidden="true"><div class="orb"><div class="bars">${[22,40,62,45,76,51,32,17].map(h=>`<i style="height:${h}px"></i>`).join('')}</div></div><div class="float">✦ &nbsp; Your next chapter starts with practice</div></div></section>${session?'<div class="notice actions"><span>You have an unfinished session on this browser.</span><button id="resume">Resume interview</button><button id="discard">Discard draft</button></div>':''}<div class="grid"><section class="card"><div class="card-head"><div><h2>Set up your interview</h2><span class="muted small">Choose a track and make this session yours.</span></div><span class="step">01 / PREPARE</span></div><form id="setup"><div class="fields"><div class="full"><label for="studentName">Student name</label><input id="studentName" placeholder="e.g. Sai Kushal" maxlength="80" value="${esc(config.name)}" required></div><div class="full"><label>Choose your technical track</label><div class="tracks">${tracks.map((t,i)=>`<button type="button" class="track ${config.track===t?'selected':''}" data-track="${i}" aria-pressed="${config.track===t}"><span class="icon">${['D','↗','☁','{ }'][i]}</span>${t}</button>`).join('')}</div></div><div><label for="level">Experience level</label><select id="level">${['All levels','Foundation','Advanced'].map(x=>`<option ${x===config.level?'selected':''}>${x}</option>`).join('')}</select></div><div><label for="mode">Interview mode</label><select id="mode">${['Student practice','Instructor-led'].map(x=>`<option ${x===config.mode?'selected':''}>${x}</option>`).join('')}</select></div><div><label for="count">Questions</label><select id="count">${[3,5,8].map(x=>`<option value="${x}" ${x===config.count?'selected':''}>Up to ${x} questions</option>`).join('')}</select></div><div><label for="minutes">Session duration</label><select id="minutes">${[10,15,20,30].map(x=>`<option value="${x}" ${x===config.minutes?'selected':''}>${x} minutes</option>`).join('')}</select></div></div><div class="divider"></div><div class="actions"><button class="primary" ${session?'disabled':''}>Start interview &nbsp; →</button><button type="button" id="share">Copy practice link</button></div><p class="small muted" id="sessionHint" style="margin:12px 0 0">${count} questions available for this selection · ${config.minutes} minute guided timer</p></form></section><div><section class="card"><h2>A simple path to progress</h2><div class="listitem"><span class="num">1</span><div><h3>Think through the scenario</h3><p>Explain your approach, trade-offs and a real example.</p></div></div><div class="listitem"><span class="num">2</span><div><h3>Capture your answer</h3><p>Type your response, or have your instructor record notes during a live interview.</p></div></div><div class="listitem"><span class="num">3</span><div><h3>Reflect with a rubric</h3><p>Review answer guides, score three skills, and download your session report.</p></div></div><div class="callout"><strong style="color:var(--ink)">Your practice, on this device</strong><br>Answers and history stay in this browser. Scores are self- or instructor-assessed, not AI grades. No account or shared class dashboard is connected.</div></section></div></div><div class="stats"><div class="stat"><strong>${history.length}</strong><span>Completed sessions on this device</span></div><div class="stat"><strong>${bank().length}</strong><span>Questions to build confidence</span></div><div class="stat"><strong>3</strong><span>Skills in every feedback rubric</span></div></div>${foot()}`;
$('studentName').oninput=e=>config.name=e.target.value;document.querySelectorAll('[data-track]').forEach(b=>b.onclick=()=>{config.track=tracks[+b.dataset.track];home()});['level','mode','count','minutes'].forEach(k=>$(k).onchange=e=>{config[k]=['count','minutes'].includes(k)?+e.target.value:e.target.value;home()});$('setup').onsubmit=e=>{e.preventDefault();start()};$('share').onclick=share;if(session){$('resume').onclick=()=>setPage('interview');$('discard').onclick=()=>{if(confirm('Discard the unfinished interview and its answers?')){session=null;save('kc-active-v1',null);home()}}}}
function start(){if(session)return;if(!config.name.trim()){$('studentName').focus();return}const pool=available().slice();for(let i=pool.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}const qs=pool.slice(0,config.count);if(!qs.length){toast('Add questions to this track before starting.');return}session={id:crypto.randomUUID(),...config,name:config.name.trim(),questions:qs,answers:qs.map(()=>({text:'',scores:[null,null,null],notes:''})),index:0,started:new Date().toISOString(),deadline:Date.now()+config.minutes*60000};save('kc-active-v1',session);setPage('interview')}
async function share(){const u=new URL(location.href);u.search='';for(const k of ['track','level','count','minutes'])u.searchParams.set(k,config[k]);try{await navigator.clipboard.writeText(u.href);toast('Practice link copied. It contains settings only, not student data.')}catch{prompt('Copy this practice link:',u.href)}}
const dimensions=['Technical accuracy','Reasoning & trade-offs','Clarity & structure'];
function showInterview(){if(!session){setPage('practice');return}const s=session,q=s.questions[s.index],a=s.answers[s.index];$('app').innerHTML=`<div class="card-head"><div><div class="eyebrow">${esc(s.mode)} · ${esc(s.track)}</div><h1>${esc(s.name)}’s practice session</h1></div><div style="text-align:right"><div id="timer" class="timer"></div><span class="muted small">Session time remaining</span></div></div><div id="timeNotice" class="notice hidden">Your planned time is up. You can finish reviewing your answers and submit when ready.</div><div class="progress"><div style="width:${(s.index+1)/s.questions.length*100}%"></div></div><div class="grid"><section class="card"><span class="pill">Question ${s.index+1} of ${s.questions.length}</span><span class="pill">${esc(q.level)}</span><h2 class="question">${esc(q.text)}</h2><p class="small muted">Explain what you would do, why you would do it, and how you would verify it.</p><label for="answer">${s.mode==='Instructor-led'?'Student answer / interviewer notes':'Your answer'}</label><textarea id="answer" maxlength="15000" placeholder="Start with your approach, then walk through the details…">${esc(a.text)}</textarea><p class="small muted" id="words">${wordCount(a.text)} words · Draft saved on this device</p><div class="actions"><button id="prev" ${s.index===0?'disabled':''}>← Previous</button>${s.index<s.questions.length-1?'<button id="next" class="primary">Next question →</button>':'<button id="finish" class="primary">Finish & view report →</button>'}</div><button id="backHome" style="margin-top:14px;border:0;padding-left:0;color:var(--muted)">Save & leave for now</button></section><section class="card"><h2>Review & reflect</h2><p class="muted small">${s.mode==='Instructor-led'?'Instructor rubric':'Self-assessment rubric'} · Scores are optional. Unrated answers stay ungraded.</p><details id="guide"><summary style="cursor:pointer;color:var(--purple);font-weight:650">Reveal answer guide</summary><ul class="small muted">${q.guide.map(p=>`<li>${esc(p)}</li>`).join('')}</ul><p class="small muted">These are discussion points, not an exhaustive model answer.</p></details><div class="divider"></div>${dimensions.map((d,i)=>`<div class="rating"><label for="score${i}">${d}</label><select id="score${i}"><option value="">Not rated</option>${[0,1,2,3,4].map(n=>`<option value="${n}" ${a.scores[i]===n?'selected':''}>${n} — ${['Missing','Developing','Partial','Strong','Excellent'][n]}</option>`).join('')}</select></div>`).join('')}<label for="notes" style="margin-top:20px">Feedback / next step</label><textarea id="notes" style="min-height:100px" maxlength="5000" placeholder="One thing to practise before the next interview…">${esc(a.notes)}</textarea><div class="callout" style="margin-top:15px">Score the substance of the answer. A long response is not automatically a strong response.</div></section></div>${foot()}`;
$('answer').oninput=e=>{a.text=e.target.value;persist();$('words').textContent=wordCount(a.text)+' words · '+(storageOK?'Draft saved on this device':'Draft not saved; keep this page open')};$('notes').oninput=e=>{a.notes=e.target.value;persist()};dimensions.forEach((_,i)=>$('score'+i).onchange=e=>{a.scores[i]=e.target.value===''?null:+e.target.value;persist()});$('prev').onclick=()=>move(-1);if($('next'))$('next').onclick=()=>move(1);if($('finish'))$('finish').onclick=finish;$('backHome').onclick=()=>setPage('practice');tick()}
function wordCount(t){return t.trim()?t.trim().split(/\s+/).length:0}function persist(){save('kc-active-v1',session)}function move(d){session.index+=d;persist();showInterview();window.scrollTo(0,0)}
function tick(){if(page!=='interview'||!session)return;const remaining=Math.max(0,Math.ceil((session.deadline-Date.now())/1000));$('timer').textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0');$('timeNotice').classList.toggle('hidden',remaining>0)}setInterval(tick,1000);
function finish(){const missing=session.answers.filter(a=>!a.text.trim()).length;if(missing&&!confirm(`${missing} question(s) have no answer. Finish this session anyway?`))return;lastReport={...session,completed:new Date().toISOString()};history.unshift(lastReport);history=history.slice(0,100);save('kc-history-v1',history);session=null;save('kc-active-v1',null);setPage('report');window.scrollTo(0,0)}
function scoring(r){const vals=r.answers.flatMap(a=>a.scores.filter(n=>n!==null));return {pct:vals.length?Math.round(vals.reduce((x,y)=>x+y,0)/(vals.length*4)*100):null,rated:vals.length,answered:r.answers.filter(a=>a.text.trim()).length}}
function scoreText(r){const s=scoring(r);return s.pct===null?'Not graded':s.pct+'%'}
function showReport(r){if(!r){setPage('history');return}const s=scoring(r),ratings=dimensions.map((d,i)=>{const v=r.answers.map(a=>a.scores[i]).filter(x=>x!==null);return {d,avg:v.length?v.reduce((a,b)=>a+b,0)/v.length:null}});const weakest=ratings.filter(x=>x.avg!==null).sort((a,b)=>a.avg-b.avg)[0];$('app').innerHTML=`<div class="card-head"><div><div class="eyebrow">SESSION COMPLETE</div><h1>One step closer, ${esc(r.name)}.</h1><p class="muted">${esc(r.track)} · ${esc(r.mode)} · ${new Date(r.completed).toLocaleDateString()}</p></div><button class="no-print" id="newSession">New interview</button></div><div class="report-top"><div class="eyebrow" style="color:#c2baff">${r.mode==='Instructor-led'?'INSTRUCTOR-ASSESSED':'SELF-ASSESSED'} RESULT</div><strong>${scoreText(r)}</strong><p style="margin:0;color:#d9d5ef">${s.answered} / ${r.questions.length} answers captured · ${s.rated} / ${r.questions.length*3} rubric ratings completed</p><p class="small" style="margin:8px 0 0;color:#d9d5ef">${s.pct===null?'Add rubric ratings during your next session to measure progress.':'Percentage uses rated criteria only. It is not an AI evaluation or a hiring prediction.'}</p></div><div class="stats" style="margin-bottom:24px">${ratings.map(x=>`<div class="stat"><strong>${x.avg===null?'—':x.avg.toFixed(1)+' / 4'}</strong><span>${x.d}</span></div>`).join('')}</div><div class="callout" style="margin-bottom:20px"><strong>Next practice focus</strong><br>${weakest?'Review '+esc(weakest.d.toLowerCase())+' using the answer guides below. Try each response again with a concrete project example.':'Compare each answer with its guide and discuss the gaps with your instructor.'}</div><div class="actions no-print" style="margin-bottom:24px"><button id="download">Download report (.txt)</button><button id="print">Print / save PDF</button></div>${r.questions.map((q,i)=>`<section class="card qcard"><span class="pill">Question ${i+1}</span><h3>${esc(q.text)}</h3><label style="margin-top:15px">Captured answer</label><p style="white-space:pre-wrap">${esc(r.answers[i].text)||'<em class="muted">No answer captured</em>'}</p><p class="small muted">${dimensions.map((d,j)=>`${d}: ${r.answers[i].scores[j]===null?'Not rated':r.answers[i].scores[j]+'/4'}`).join(' · ')}</p>${r.answers[i].notes?`<div class="callout" style="white-space:pre-wrap"><strong>Feedback</strong><br>${esc(r.answers[i].notes)}</div>`:''}<details><summary>Answer guide</summary><ul>${q.guide.map(p=>`<li>${esc(p)}</li>`).join('')}</ul></details></section>`).join('')}${foot()}`;$('newSession').onclick=()=>setPage('practice');$('download').onclick=()=>downloadReport(r);$('print').onclick=()=>window.print()}
function downloadReport(r){const s=scoring(r);const text=['INTERVIEW STUDIO | Kushal Chowdary D365 CRM Tech Solutions',`Student: ${r.name}`,`Track: ${r.track} | Mode: ${r.mode}`,`Completed: ${new Date(r.completed).toLocaleString()}`,`Assessed result: ${scoreText(r)} | Rated criteria: ${s.rated}/${r.questions.length*3}`,'Scores use rated criteria only and are self- or instructor-assessed, not AI grades.','',...r.questions.flatMap((q,i)=>[`${i+1}. ${q.text}`,'Answer: '+(r.answers[i].text||'Not answered'),...dimensions.map((d,j)=>`${d}: ${r.answers[i].scores[j]??'Not rated'}${r.answers[i].scores[j]===null?'':'/4'}`),'Feedback: '+(r.answers[i].notes||'None'),'Answer guide:',...q.guide.map(g=>'- '+g),''])].join('\n');const url=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='interview-report-'+r.completed.slice(0,10)+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function showBank(){ $('app').innerHTML=`<div class="card-head"><div><div class="eyebrow">BUILD YOUR KNOWLEDGE</div><h1>Your question bank</h1><p class="muted">Practical prompts for meaningful technical conversations.</p></div><button id="add" class="primary">+ Add question</button></div><div class="filter"><input id="search" aria-label="Search questions" placeholder="Search questions or topics…"><select id="filterTrack" aria-label="Filter track"><option>All tracks</option>${tracks.map(t=>`<option>${t}</option>`).join('')}</select><select id="filterLevel" aria-label="Filter level"><option>All levels</option><option>Foundation</option><option>Advanced</option></select></div><p id="bankCount" class="small muted"></p><div id="bankList"></div>${foot()}`;['search','filterTrack','filterLevel'].forEach(id=>$(id).oninput=filterBank);$('add').onclick=()=>{$('customForm').reset();$('customTrack').innerHTML=tracks.map(t=>`<option>${t}</option>`).join('');$('customDialog').showModal()};filterBank()}
function filterBank(){const query=$('search').value.toLowerCase(),tr=$('filterTrack').value,lev=$('filterLevel').value;const qs=bank().filter(q=>(tr==='All tracks'||q.track===tr)&&(lev==='All levels'||q.level===lev)&&(q.text+' '+q.guide.join(' ')).toLowerCase().includes(query));$('bankCount').textContent=qs.length+' questions';$('bankList').innerHTML=qs.length?qs.map(q=>`<section class="card qcard"><span class="pill">${esc(q.track)}</span><span class="pill">${esc(q.level)}</span>${q.custom?'<span class="pill">Custom</span>':''}<h3>${esc(q.text)}</h3><details><summary>View answer guide</summary><ul>${q.guide.map(p=>`<li>${esc(p)}</li>`).join('')}</ul></details>${q.custom?`<button data-remove="${esc(q.id)}" class="small" style="margin-top:12px">Delete custom question</button>`:''}</section>`).join(''):'<div class="card empty">No questions match. Try a different search.</div>';document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{if(confirm('Delete this custom question? Existing reports will be kept.')){custom=custom.filter(q=>q.id!==b.dataset.remove);save('kc-questions-v1',custom);filterBank()}})}
$('cancelCustom').onclick=()=>$('customDialog').close();$('customForm').onsubmit=e=>{e.preventDefault();const text=$('customText').value.trim(),guide=$('customGuide').value.split('\n').map(x=>x.trim()).filter(Boolean);if(!text||!guide.length){toast('Enter a question and at least one answer-guide point.');return}custom.push({id:crypto.randomUUID(),track:$('customTrack').value,level:$('customLevel').value,text,guide,custom:true});save('kc-questions-v1',custom);$('customDialog').close();filterBank();toast('Question added to your local bank.')};
function showHistory(){$('app').innerHTML=`<div class="card-head"><div><div class="eyebrow">REFLECT & IMPROVE</div><h1>Your session history</h1><p class="muted">Reports saved on this browser · Latest 100 sessions retained</p></div>${history.length?'<button id="clear">Clear history</button>':''}</div>${history.length?history.map((r,i)=>`<section class="card qcard"><div class="card-head" style="margin:0"><div><span class="pill">${esc(r.track)}</span><h3>${esc(r.name)}</h3><span class="muted small">${new Date(r.completed).toLocaleString()} · ${r.questions.length} questions · ${esc(r.mode)}</span></div><div style="text-align:right"><strong>${scoreText(r)}</strong><br><button data-report="${i}" style="margin-top:10px">View report →</button></div></div></section>`).join(''):'<section class="card empty"><div style="font-size:36px;color:var(--purple)">◷</div><h2>Your progress starts with one session.</h2><p>Complete an interview to see your answers and feedback here.</p><button id="first" class="primary">Start practising →</button></section>'}<div class="callout" style="margin-top:20px">This history is local to this device and browser. Download reports to share them with your instructor. Clearing browser data removes saved sessions.</div>${foot()}`;document.querySelectorAll('[data-report]').forEach(b=>b.onclick=()=>{lastReport=history[+b.dataset.report];setPage('report')});if($('clear'))$('clear').onclick=()=>{if(confirm('Permanently clear all completed reports from this browser? Download any reports you need first.')){history=[];save('kc-history-v1',history);showHistory()}};if($('first'))$('first').onclick=()=>setPage('practice')}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>setPage(b.dataset.page));render();
</script></body></html>
